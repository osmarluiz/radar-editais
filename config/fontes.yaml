    url: https://www.secti.df.gov.br/editais-de-chamamento-publico

  # --- Clima, observação da Terra e IA ---
  - id: fundo-amazonia
    nome: Fundo Amazônia
    categoria: federal
    url: https://www.fundoamazonia.gov.br/pt/como-apresentar-projetos/chamadas-publicas/
