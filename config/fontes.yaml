# Os perfis usados para a relevância ficam em config/perfis.yaml (privado, fora do git)
# ou no secret RADAR_PERFIS. Modelo: config/perfis.exemplo.yaml.

# Cada fonte: id único, nome, categoria (federal | fap | inovacao | internacional),
# url da página que lista os editais e, opcionalmente, um seletor CSS do conteúdo.
# leitor: true busca a página via r.jina.ai (sites que bloqueiam IP estrangeiro).
# Para APIs JSON: formato: json e, se quiser, link_modelo com campos do item ({id}).
fontes:
  # --- Federais ---
  - id: cnpq
    nome: CNPq
    categoria: federal
    url: https://www.gov.br/cnpq/pt-br/chamadas/abertas-para-submissao
  - id: capes
    nome: CAPES
    categoria: federal
    url: https://www.gov.br/capes/pt-br/assuntos/editais-e-resultados-capes
  - id: finep
    nome: FINEP
    categoria: federal
    # A página de oportunidades é montada por JavaScript; esta é a API que ela consulta
    url: "https://www.finep.gov.br/o/c/chamadapublicas?filter=situacao%20eq%20%27aberta%27&pageSize=100&fields=id,titulo,descricaoRawText,prazoProposto,publicoAlvo,tipoDeOportunidade,regiao"
    formato: json
    link_modelo: "https://www.finep.gov.br/e/chamada-publica/222684/{id}"

  # --- FAPs ---
  - id: fapdf
    nome: FAPDF
    categoria: fap
    url: https://www.fap.df.gov.br/editais-fapdf-20261  # o endereço muda todo ano
    leitor: true  # o site do GDF bloqueia os servidores do GitHub
  - id: fapdf-internacional
    nome: FAPDF (chamadas internacionais)
    categoria: fap
    url: https://www.fap.df.gov.br/chamadas-internacionais-20261
    leitor: true  # o site do GDF bloqueia os servidores do GitHub
  - id: fapesp
    nome: FAPESP
    categoria: fap
    url: https://fapesp.br/chamadas/
  - id: fapemig
    nome: FAPEMIG
    categoria: fap
    url: https://fapemig.br/pt/chamadas-abertas/
  - id: faperj
    nome: FAPERJ
    categoria: fap
    url: https://www.faperj.br/?id=28.5.7
  - id: fapeg
    nome: FAPEG (Goiás)
    categoria: fap
    url: https://goias.gov.br/fapeg/editais/inscricoes-abertas/
  - id: fapergs
    nome: FAPERGS
    categoria: fap
    url: https://fapergs.rs.gov.br/mapa-do-site
  - id: fapesc
    nome: FAPESC
    categoria: fap
    url: https://fapesc.sc.gov.br/category/chamadas-abertas/
  - id: araucaria
    nome: Fundação Araucária (PR)
    categoria: fap
    url: https://www.fappr.pr.gov.br/Programas-Abertos
  - id: fapemat
    nome: FAPEMAT
    categoria: fap
    url: https://www.fapemat.mt.gov.br/pt/editais_1?categoryId=73983336
  - id: fundect
    nome: FUNDECT (MS)
    categoria: fap
    url: https://www.fundect.ms.gov.br/informativos/consultas/
  - id: fapesb
    nome: FAPESB
    categoria: fap
    url: https://www.fapesb.ba.gov.br/category/edital/
  - id: fapema
    nome: FAPEMA
    categoria: fap
    url: https://www.fapema.br/editais/
  - id: facepe
    nome: FACEPE
    categoria: fap
    url: https://www.facepe.br/editais/todos/

  # --- Inovação ---
  - id: embrapii
    nome: EMBRAPII
    categoria: inovacao
    url: https://embrapii.org.br/chamadas-publicas/feed/
  - id: bndes
    nome: BNDES
    categoria: inovacao
    url: https://www.bndes.gov.br/chamadadeinovacao
  - id: serrapilheira
    nome: Instituto Serrapilheira
    categoria: inovacao
    url: https://serrapilheira.org/todas-as-chamadas/
  - id: centelha
    nome: Programa Centelha
    categoria: inovacao
