  - id: lift-lab
    nome: LIFT Lab (Banco Central)
    categoria: inovacao
    url: https://www.liftlab.com.br/

  # --- PPP, PMI e compras públicas de inovação ---
  - id: sepe-df-ppp
    nome: SEPE-DF (PPPs e concessões)
    categoria: ppp
    url: https://www.sepe.df.gov.br/editais-de-chamamento
    leitor: true
  - id: pncp-cpsi
    nome: PNCP – contratações de solução inovadora (CPSI)
    categoria: ppp
    url: "https://pncp.gov.br/api/search/?q=%22solu%C3%A7%C3%A3o+inovadora%22&tipos_documento=edital&ordenacao=-data&pagina=1&tam_pagina=50&status=recebendo_proposta"
    formato: json
    link_modelo: "https://pncp.gov.br/app/editais/{orgao_cnpj}/{ano}/{numero_sequencial}"

  # --- Empresas e adoção de tecnologia ---
  - id: senai-inovacao
    nome: SENAI – Plataforma Inovação para a Indústria
    categoria: empresas
