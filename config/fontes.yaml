# Perfil usado pelo Claude para marcar a relevância de cada edital.
perfil: |
  Pesquisador e empreendedor em Brasília (DF), doutorado em sensoriamento remoto.
  Temas de interesse: sensoriamento remoto, imagens de satélite, geoprocessamento,
  inteligência artificial e aprendizado de máquina, agricultura e uso da terra no
  Cerrado, meio ambiente e clima, inovação tecnológica, startups e empresas de base
  tecnológica. Pode concorrer como pessoa física (pesquisador) ou como empresa.
  Editais restritos a outros estados ou a áreas sem relação com esses temas são baixa relevância.

