    categoria: inovacao
    url: https://www.inovativabrasil.com.br/

  # --- Internacionais ---
  - id: confap
    nome: CONFAP (cooperação internacional)
    categoria: internacional
    url: https://confap.org.br/pt/editais
  - id: belmont
    nome: Belmont Forum
    categoria: internacional
    url: https://belmontforum.org/open-opportunities/
  - id: daad
    nome: DAAD Brasil
    categoria: internacional
    url: https://www.daad-brasil.org/pt/bolsas/busca/
  - id: fulbright
    nome: Fulbright Brasil
    categoria: internacional
    url: https://fulbright.org.br/bolsas-para-brasileiros
  - id: google-research
    nome: Google Research
    categoria: internacional
    url: https://research.google/programs-and-events/
  - id: idrc
    nome: IDRC (Canadá)
    categoria: internacional
    url: https://idrc-crdi.ca/en/funding
  - id: climatechange-ai
    nome: Climate Change AI
    categoria: internacional
    url: https://www.climatechange.ai/calls

  # --- Turismo e fintech ---
  - id: mtur-chamadas
    nome: Ministério do Turismo
    categoria: turismo
    url: https://www.gov.br/turismo/pt-br/acesso-a-informacao/participacao-social/chamadas-publicas-e-selecoes
  - id: embratur
    nome: Embratur (inclui EmbraturLAB)
    categoria: turismo
    url: https://embratur.com.br/transparencia/editais
    leitor: true  # acesso direto dá 403
  - id: caixa-startups
    nome: CAIXA – Chamadas de Startup
    categoria: inovacao
    url: https://www.caixa.gov.br/sobre-a-caixa/inovacao/Paginas/default.aspx
