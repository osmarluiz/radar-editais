name: Radar de editais

on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Brasília
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reextrair todas as fontes, mesmo sem mudança"
        type: boolean
        default: false
      fontes:
        description: "Processar só estas fontes (ids separados por espaço; vazio = todas)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Coletar editais
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCAR: ${{ inputs.forcar && '--forcar' || '' }}
          FONTES: ${{ inputs.fontes }}
        run: |
          args="$FORCAR"
          for f in $FONTES; do args="$args --fonte $f"; done
          python scripts/radar.py $args

      - name: Salvar dados
        id: commit
        run: |
          git config user.name "radar-editais[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "dados: atualização de $(TZ=America/Sao_Paulo date +%F)"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      # Push feito com GITHUB_TOKEN pode não disparar o build do Pages
      - name: Atualizar GitHub Pages
        if: steps.commit.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
