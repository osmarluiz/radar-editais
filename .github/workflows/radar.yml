name: Radar de editais

on:
  schedule:
    - cron: "23 8 * * *" # ~05:23 em Brasília; minuto quebrado porque o GitHub atrasa ou pula os horários cheios
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reextrair todas as fontes, mesmo sem mudança"
        type: boolean
        default: false
      fontes:
        description: "Processar só estas fontes (ids separados por espaço; vazio = todas)"
        type: string
        default: ""
      testar_email:
        description: "Mandar um e-mail de teste com até 8 editais relevantes já abertos"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Coletar editais
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          RADAR_NOVOS: ${{ runner.temp }}/novos.md
          RADAR_PERFIS: ${{ secrets.RADAR_PERFIS }}
          FORCAR: ${{ inputs.forcar && '--forcar' || '' }}
          FONTES: ${{ inputs.fontes }}
          TESTE: ${{ inputs.testar_email && '--testar-email' || '' }}
        run: |
          args="$FORCAR $TESTE"
          for f in $FONTES; do args="$args --fonte $f"; done
          python scripts/radar.py $args

      - name: Salvar dados
        id: commit
        run: |
          git config user.name "radar-editais[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "dados: atualização de $(TZ=America/Sao_Paulo date +%F)"
            git pull --rebase
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      # Push feito com GITHUB_TOKEN pode não disparar o build do Pages
      - name: Atualizar GitHub Pages
        if: steps.commit.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Enviar e-mail
        id: email
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          PAINEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          [ -s "$RUNNER_TEMP/novos.json" ] || { echo "Nada novo para avisar."; exit 0; }
          python scripts/enviar_email.py "$RUNNER_TEMP/novos.json"

      # Sem e-mail configurado (ou se o envio falhar), o aviso vai por issue,
      # que o GitHub também manda por e-mail para o dono do repositório
      - name: Avisar editais novos por issue
        if: steps.email.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NOVOS: ${{ runner.temp }}/novos.md
        run: |
          [ -s "$NOVOS" ] || { echo "Nada novo para avisar."; exit 0; }
          n=$(grep -c '^- ' "$NOVOS")
          {
            echo "@${{ github.repository_owner }}, $n edital(is) relevante(s) apareceram no radar:"
            echo
            cat "$NOVOS"
            echo
            echo "---"
            echo "Painel: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } > corpo.md
          gh issue create --repo "${{ github.repository }}" \
            --title "Radar: $n editais novos em $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file corpo.md
